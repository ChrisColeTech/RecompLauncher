# nxrs - native game library and build launcher.
# Licensed under the GNU Affero General Public License v3.0, see LICENSE.txt and NOTICE.txt.
name: Portable release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which bundle to build'
        type: choice
        default: all
        options: [all, windows, linux]
      nxrs_engine:
        description: 'Bundle the nxrs engine (ChrisColeTech/nxrs-engine, public, MIT) in the Windows and Linux bundles'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ENGINE: third_party/Switch2RECOMP   # the engine submodule (turbo branch of Switch2RECOMP-turbo)
  # The nxrs engine in the Windows and Linux bundles: ON (the engine is public, MIT; no token). Off-switches: the
  # nxrs_engine input of a manual run, and the repository variable NXRS_ENGINE_IN_RELEASE = 'false' for pushes and pull
  # requests. NXRS_ENGINE_REF (variable) picks the engine commit, main by default. docs/LAUNCHER.md, "Release integration".
  NXRS_ENGINE_ON: ${{ (github.event_name == 'workflow_dispatch' && inputs.nxrs_engine) || (github.event_name != 'workflow_dispatch' && vars.NXRS_ENGINE_IN_RELEASE != 'false') }}
  NXRS_ENGINE_REF: ${{ vars.NXRS_ENGINE_REF || 'main' }}
  # the nxnative commit the engine's shader translator (dmsh_xlate) is built from (the engine's own CI uses the same)
  NXRS_NXNATIVE: 'e4b0d9b75d39c41c10fdcfec2f0b070df496d7e5'
  NXRS_RUST: '1.99.0'
  NXRS_LLVM_MINGW: '20261104'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ github.event_name != 'workflow_dispatch' && fromJSON('["windows", "linux"]') || (inputs.platform != 'all' && fromJSON(format('["{0}"]', inputs.platform)) || fromJSON('["windows", "linux"]')) }}
        include:
          - platform: windows
            os: windows-2022
            qt_arch: win64_msvc2022_64
          - platform: linux
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build glslang-tools libx11-dev libgl-dev libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          modules: qtimageformats   # qtsvg ships inside qtbase's desktop package; its sources/licenses are packaged separately
          cache: true
      - name: Download bundled tools and license sources
        run: python scripts/release-deps.py --dest build/release-deps
      - name: Engine Python regression tests
        run: python -m unittest discover -s ${{ env.ENGINE }}/tests -p "test_n*.py"
      - name: Python selection tests (engine and launcher)
        run: |
          python ${{ env.ENGINE }}/tests/test_python_selection.py -v
          python tests/test_python_selection.py -v
      - name: Packaging regression tests
        run: python tests/test_release.py -v
      - name: Linux audio regression tests
        if: runner.os == 'Linux'
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/release-deps/lib
        run: sh ${{ env.ENGINE }}/tests/run_audio.sh
      - name: Linux AV1 decoder test (the engine's committed dav1d)
        if: runner.os == 'Linux'
        run: python ${{ env.ENGINE }}/tests/test_av1.py
      - name: Windows launcher build dependencies
        if: runner.os == 'Windows'
        run: python -m pip install cmake==3.31.10 ninja==1.13.2
      - name: Windows shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 --branch 15.1.0 https://github.com/KhronosGroup/glslang.git build/glslang-src
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S build/glslang-src -B build/glslang -G "Visual Studio 17 2022" -A x64 -DENABLE_OPT=OFF -DENABLE_HLSL=OFF -DBUILD_TESTING=OFF -DENABLE_GLSLANG_BINARIES=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/glslang --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Resolve-Path build/glslang/StandAlone/Release).Path >> $env:GITHUB_PATH
      - name: Windows controller and shader regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$pwd\build\release-deps\gcc\Library\bin;$env:PATH"
          $env:NXSHADER_TOOLS = "$pwd\build\release-deps\shader-tools\Library\bin"
          New-Item -ItemType Directory -Force "$env:ENGINE/build/mkw-investigation" | Out-Null
          python "$env:ENGINE/tests/test_controllers.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python "$env:ENGINE/tests/test_mkw_runtime.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python "$env:ENGINE/tests/test_av1.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows runtime and launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$pwd\build\release-deps\gcc\Library\bin;$env:PATH"
          python "$env:ENGINE/tools/build_nvn.py" --jobs 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:ENGINE/build/nvn/libnvn.a")) { throw 'NVN archive missing' }
          python src/recomp_cli.py --build-runtime --target win64 --backend win32 --cc "$pwd\build\release-deps\gcc\Library\bin\x86_64-w64-mingw32-gcc.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/build-launcher.ps1 -QtPrefix $env:QT_ROOT_DIR -Jobs 4
      - name: Linux runtime and launcher
        if: runner.os == 'Linux'
        run: |
          python "$ENGINE/tools/build_nvn.py" --linux --jobs 4
          test -s "$ENGINE/build/nvn_lin/libnvn.a"
          test -s "$ENGINE/runtime/vp9/lin/libvpx.a"
          test -s "$ENGINE/runtime/av1/lin/libdav1d.a"
          python src/recomp_cli.py --build-runtime --target linux --backend x11 --cc gcc
          SWR_QT_PREFIX="$QT_ROOT_DIR" SWR_JOBS=4 sh scripts/build-launcher.sh
      # ---- the nxrs engine (on by default, see NXRS_ENGINE_ON): the public engine at NXRS_ENGINE_REF, built here; its
      # shader translator built from nxnative's source; spirv-val comes from the release's shader tools
      - name: nxrs engine checkout
        if: env.NXRS_ENGINE_ON == 'true'
        uses: actions/checkout@v4
        with:
          repository: ChrisColeTech/nxrs-engine
          ref: ${{ env.NXRS_ENGINE_REF }}
          path: build/nxrs-engine
      - name: nxnative source for dmsh_xlate
        if: env.NXRS_ENGINE_ON == 'true'
        shell: bash
        run: |
          git init -q build/nxnative && cd build/nxnative
          git config core.autocrlf true   # the CRLF files the Windows tool was built from: the same --source-sha (e11dc43d4ddc5b58)
          git remote add origin https://github.com/seedds/nxnative.git
          git sparse-checkout set dm/gfx/tools/dmsh_xlate dm/third_party/ryujinx
          git fetch -q --depth 1 --filter=blob:none origin "$NXRS_NXNATIVE"
          git checkout -q FETCH_HEAD
      - uses: actions/setup-dotnet@v4
        if: env.NXRS_ENGINE_ON == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: nxrs engine build (Windows)
        if: runner.os == 'Windows' && env.NXRS_ENGINE_ON == 'true'
        shell: pwsh
        working-directory: build/nxrs-engine
        run: |
          rustup toolchain install $env:NXRS_RUST --profile minimal --target x86_64-pc-windows-gnullvm
          rustup default $env:NXRS_RUST
          $name = "llvm-mingw-$env:NXRS_LLVM_MINGW-ucrt-x86_64"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:NXRS_LLVM_MINGW/$name.zip" -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath build/tools
          Rename-Item "build/tools/$name" llvm-mingw
          # graphics' GLSL: the glslangValidator built above (the shader compiler step put it on PATH)
          $env:NXGFX_GLSLANG = (Get-Command glslangValidator).Source
          cargo build --locked --release --jobs 4 -p cli -p front -p runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = "$pwd\build\tools\llvm-mingw\bin;$env:PATH"
          $env:CC_x86_64_pc_windows_gnullvm = 'x86_64-w64-mingw32-clang'
          cargo build --locked --release --jobs 4 --target x86_64-pc-windows-gnullvm -p front -p runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # the windows crate's import library the gnullvm engine links with (package-release.py takes it from here)
          New-Item -ItemType Directory -Force build/tools/gnu-libs | Out-Null
          $lib = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src" -Recurse -Filter libwindows.0.52.0.a | Where-Object { $_.FullName -match 'gnullvm' } | Select-Object -First 1
          if (-not $lib) { throw 'libwindows.0.52.0.a (windows_x86_64_gnullvm) not found' }
          Copy-Item $lib.FullName build/tools/gnu-libs/
          pwsh src/shaders/tools/build_dmsh_xlate.ps1 -Nxnative ..\nxnative -Out build\tools\dmsh_xlate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: nxrs engine build (Linux, x86-64)
        if: runner.os == 'Linux' && env.NXRS_ENGINE_ON == 'true'
        working-directory: build/nxrs-engine
        run: |
          sudo apt-get install -y --no-install-recommends clang lld pkg-config libvulkan-dev libasound2-dev libopus-dev \
            libvpx-dev libdav1d-dev libavcodec-dev libavutil-dev zlib1g-dev
          rustup toolchain install "$NXRS_RUST" --profile minimal
          rustup default "$NXRS_RUST"
          export NXGFX_GLSLANG="$(command -v glslangValidator)"
          cargo build --locked --release --jobs 4 -p cli -p front -p runtime
          bash src/shaders/tools/build_dmsh_xlate.sh ../nxnative build/tools/dmsh_xlate-linux
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nxrs = @()
          if ($env:NXRS_ENGINE_ON -eq 'true') {
            $nxrs = @('--nxrs-engine', 'build/nxrs-engine', '--nxrs-target', 'build/nxrs-engine/target/release',
                      '--nxrs-gnu', 'build/nxrs-engine/target/x86_64-pc-windows-gnullvm/release')
          }
          python scripts/package-release.py --deps build/release-deps --launcher bin/launcher --qt "$env:QT_ROOT_DIR" @nxrs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          nxrs=()
          if [ "$NXRS_ENGINE_ON" = true ]; then nxrs=(--nxrs-engine build/nxrs-engine --nxrs-target build/nxrs-engine/target/release); fi
          python scripts/package-release.py --deps build/release-deps --launcher bin/launcher-linux --qt "$QT_ROOT_DIR" "${nxrs[@]}"
      - name: Test relocated Windows archive
        if: runner.os == 'Windows'
        run: python scripts/smoke-release.py dist/nxrs-windows-x64.zip
      - name: Test relocated Linux archive
        if: runner.os == 'Linux'
        run: python scripts/smoke-release.py dist/nxrs-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-${{ matrix.platform }}
          path: |
            logs/
            build/launcher-*/Testing/Temporary/LastTest.log
            ${{ env.ENGINE }}/build/controllers-*/checks.log

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0   # full launcher + engine history and tags for the changelog
      - name: Version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error file=VERSION::'$version' is not a semantic version (MAJOR.MINOR.PATCH)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # a release is published once per version: bump VERSION to release, other pushes only build and test
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::notice::v$version is already released; bump VERSION to publish a new release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          pattern: portable-*
          path: release
          merge-multiple: true
      - name: Verify downloaded archives
        if: steps.version.outputs.publish == 'true'
        working-directory: release
        run: sha256sum -c *.sha256
      - name: Publish tested bundles
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="$TAG"
          prefix=nxrs-source
          # git archive leaves submodules out; append the pinned engine so the source archive is complete (AGPL)
          git archive --format=tar --prefix="$prefix/" -o release/source.tar "$GITHUB_SHA"
          git -C "$ENGINE" archive --format=tar --prefix="$prefix/$ENGINE/" -o "$PWD/release/engine.tar" HEAD
          tar --concatenate -f release/source.tar release/engine.tar
          gzip -n -c release/source.tar > "release/$prefix.tar.gz"
          rm release/source.tar release/engine.tar
          (cd release && sha256sum "$prefix.tar.gz" > "$prefix.tar.gz.sha256")
          # changelog: launcher commits since the previous release tag, plus the engine commits the pin moved across
          python3 scripts/release-notes.py --head "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" release/*.zip release/*.tar.gz release/*.sha256 --target "$GITHUB_SHA" --title "nxrs $VERSION" --notes-file "$RUNNER_TEMP/notes.md" $(case "$VERSION" in *-*) echo --prerelease ;; *) echo --latest ;; esac)
